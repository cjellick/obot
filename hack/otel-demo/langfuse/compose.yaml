# Local Langfuse v3 for viewing Obot and Claude Code traces.
name: obot-langfuse

x-no-proxy: &no-proxy
  # Discobox injects proxy settings into containers; keep traffic between these containers direct.
  NO_PROXY: localhost,127.0.0.1,postgres,clickhouse,redis,minio,langfuse-web,langfuse-worker,172.16.0.0/12
  no_proxy: localhost,127.0.0.1,postgres,clickhouse,redis,minio,langfuse-web,langfuse-worker,172.16.0.0/12

x-langfuse-env: &langfuse-env
  <<: *no-proxy
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  SALT: ${SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: myredissecret

services:
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: [postgres, minio, redis, clickhouse]
    environment:
      <<: *langfuse-env

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: [postgres, minio, redis, clickhouse]
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: obot
      LANGFUSE_INIT_ORG_NAME: Obot
      LANGFUSE_INIT_PROJECT_ID: obot-otel
      LANGFUSE_INIT_PROJECT_NAME: Obot MCP Gateway
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-obot-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-obot-local
      LANGFUSE_INIT_USER_EMAIL: admin@obot.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: obot-langfuse
    networks: [default, otel]

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio_data:/data

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: --requirepass myredissecret

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  otel:
    external: true

volumes:
  clickhouse_data:
  minio_data:
  postgres_data:
